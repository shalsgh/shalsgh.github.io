<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minho Noh (노민호)</title>
    <meta property="og:description" content="Resume, Github and more">
</head>

<body>
    <main>
        <div class="intro">
            <div class="name">
                <h1>Minho Noh</h1>
                <span>노민호</span>
            </div>
            <p class="desc-large">
                AI-Powered Mobile/Web Developer
            </p>
            <ul class="desc-large">
                <li>Leveraging AI tools for fast and accurate development</li>
                <li>Cross-platform mobile/web development experience</li>
                <li>Continuous learning with sensitivity to latest tech trends</li>
            </ul>
            <div class="other-infos">
                <div class="other-info email">
                    <span>📧</span>
                    <a href="mailto:shalsgh0@gmail.com">shalsgh0@gmail.com</a>
                </div>
                <div class="other-info">
                    <span>📍</span>
                    <span>Seoul, Korea</span>
                </div>
            </div>
        </div>
        <div class="action-button-grid">
            <action-button to="https://github.com/shalsgh">
                Github
            </action-button>
            <action-button to="https://shalsgh0.blogspot.com/">
                Blog
            </action-button>
            <action-button to="/resume.pdf">
                Resume
            </action-button>
            <a href="portfolio.html" class="action-button">
                <img src="port_folio.svg" style="height: 1rem; width: 1rem; object-fit: contain;" alt="Portfolio">
                <span style="width: 100%;">Portfolio</span>
                →
            </a>
        </div>
    </main>
    
    <style>
        .intro {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.5rem;
            align-self: stretch;
        }

        .action-button-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            flex-direction: column;
            align-items: flex-start;
            gap: 0.625rem;
            align-self: stretch;
        }

        action-button:nth-child(odd) {
            grid-column: span 1;
        }
        
        action-button:nth-child(even) {
            grid-column: span 1;
        }

        .action-button {
            color: black;
            background-color: white;
            border-radius: 9999px;
            border: 1px solid #E3E3E3;
            text-decoration: none;
            display: flex;
            gap: 0.75rem;
            padding: 0.75rem;
            justify-content: space-between;
            align-items: center;
            align-self: stretch;
            flex: 1 0 0;
            font-size: 0.875rem;
            font-weight: 500;
            line-height: normal;
            transition: all 0.2s ease;
        }

        .action-button:hover {
            background-color: #f8f9fa;
            border-color: #d0d7de;
            transform: translateY(-1px);
        }

        .desc-large {
            font-size: 0.825rem;
        }

        ul {
            margin: 0;
            padding: 0;
            list-style-position: inside;
        }

        .name {
            display: flex;
            align-items: baseline;
            gap: 0.65rem;
            margin: 0.125rem 0;
        }

        .other-infos {
            display: flex;
            gap: 0.5rem;
        }

        .other-info {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 0.375rem;
            font-size: 0.75rem;
            margin: 0.25rem 0;
        }

        p {
            margin: 0.25rem 0;
        }

        a {
            color: black;
        }

        h1 {
            font-weight: 600;
            display: inline;
            margin: 0.5rem 0;
        }

        main {
            display: flex;
            padding: 3rem 1rem;
            flex-direction: column;
            align-items: flex-start;
            gap: 1rem;
            width: 100%;
            max-width: 768px;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: #F6F6F6;
            margin: 0;
            line-height: 125%;
            letter-spacing: -0.04em;
            font-family: Interop, "Apple SD Gothic Neo", "Noto Sans KR", "Noto Sans CJK KR", 나눔고딕, "Nanum Gothic", "Malgun Gothic", "맑은 고딕", apple-system, BlinkMacSystemFont;
        }

        @media (min-width: 768px) {
            body {
                display: flex;
                justify-content: center;
            }
        }

        @font-face {
            font-family: 'Interop';
            src: url('https://raw.githubusercontent.com/payw-org/Interop/main/web/fonts/Interop-Medium.woff2') format('woff2'),
                url('https://raw.githubusercontent.com/payw-org/Interop/main/web/fonts/Interop-Medium.woff') format('woff');
            font-weight: 500;
            font-style: normal;
            font-display: block;
        }

        @font-face {
            font-family: 'Interop';
            src: url('https://raw.githubusercontent.com/payw-org/Interop/main/web/fonts/Interop-Regular.woff2') format('woff2'),
                url('https://raw.githubusercontent.com/payw-org/Interop/main/web/fonts/Interop-Regular.woff') format('woff');
            font-weight: normal;
            font-style: normal;
            font-display: block;
        }

        @font-face {
            font-family: 'Interop';
            src: url('https://raw.githubusercontent.com/payw-org/Interop/main/web/fonts/Interop-SemiBold.woff2') format('woff2'),
                url('https://raw.githubusercontent.com/payw-org/Interop/main/web/fonts/Interop-SemiBold.woff') format('woff');
            font-weight: 600;
            font-style: normal;
            font-display: block;
        }
    </style>
    
    <script>
        class ActionButtonElement extends HTMLElement {
            connectedCallback() {
                const link = this.getAttribute("to");
                let iconSrc = "";
                
                // 버튼 텍스트에 따라 아이콘 결정
                const buttonText = this.innerHTML.trim();
                if (buttonText === "Github") {
                    iconSrc = `<svg style="height: 1.25rem;" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12Z"/>
                    </svg>`;
                } else if (buttonText === "Blog") {
                    iconSrc = `<img src="Blogger_icon.svg" style="height: 1rem; width: 1rem; border-radius: 3px;">`;
                } else if (buttonText === "Resume") {
                    iconSrc = `<svg style="height: 1.25rem;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14,2 14,8 20,8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                        <polyline points="10,9 9,9 8,9"/>
                    </svg>`;
                }
                
                this.innerHTML = `<a href="${link}" class="action-button">
                    ${iconSrc}
                    <span style="width: 100%;">${buttonText}</span>
                    →
                </a>`;
                
                // Resume 링크 클릭 시 알림
                if (buttonText === "Resume") {
                    this.querySelector('a').addEventListener('click', function(e) {
                        e.preventDefault();
                        alert('실제 링크로 변경해주세요!');
                    });
                }
            }
        }
        customElements.define("action-button", ActionButtonElement);
    </script>
</body>
</html>
